<!DOCTYPE html>
<html>

<head>
    <title>Delete Document</title>
</head>

<body>

    <h1>Delete Document</h1>

    <hr>

    <p>
        Are you sure you want to delete:
        <strong>{{ document.title }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

    </form>

    <br>

    <a href="{% url 'document_list' %}">
        Cancel
    </a>

</body>

</html>
