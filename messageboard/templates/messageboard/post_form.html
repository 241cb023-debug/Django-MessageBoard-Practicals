<!DOCTYPE html>
<html>
<head>
    <title>Message Board</title>
</head>
<body>

    <h1>Message Board</h1>

    {% for message in messages %}
        <div>
            <h3>{{ message.name }}</h3>
            <p>{{ message.email }}</p>
            <p>{{ message.message }}</p>
            <small>{{ message.created_at }}</small>
        </div>
        <hr>
    {% empty %}
        <p>No messages found.</p>
    {% endfor %}

</body>
</html>
